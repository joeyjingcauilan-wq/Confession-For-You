<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💌 Secret Confession Sender</title>
    <style>
        /* CSS for the Confession Page */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
            width: 90%;
            max-width: 500px;
            text-align: center;
        }

        h1 {
            color: #d64d6e;
            margin-bottom: 25px;
            font-size: 1.8em;
        }

        textarea {
            width: 100%;
            padding: 15px;
            margin-bottom: 20px;
            border: 2px solid #ffcccb;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 1em;
            resize: vertical;
            min-height: 150px;
        }

        button {
            background-color: #d64d6e;
            color: white;
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1.1em;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s;
        }

        button:hover {
            background-color: #b33958;
        }

        button:active {
            transform: scale(0.98);
        }

        #result {
            margin-top: 25px;
            padding: 15px;
            background-color: #fff0f0;
            border: 1px dashed #d64d6e;
            border-radius: 8px;
            word-wrap: break-word;
            text-align: left;
            display: none; /* Hidden until a link is generated or a confession is read */
        }

        #result p {
            margin-top: 0;
            font-weight: bold;
            color: #d64d6e;
        }

        /* Styling for the displayed confession (when crush opens the link) */
        #confession-display {
            font-size: 1.2em;
            padding: 20px;
            background-color: #ffcccb;
            border-radius: 10px;
            white-space: pre-wrap; /* Preserves formatting like line breaks */
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Send a Secret Crush Confession 🤫</h1>
        
        <div id="sender-view">
            <p>Write your honest feelings below. A special link will be created for you to share!</p>
            <textarea id="confession-text" placeholder="Start typing your confession here..."></textarea>
            <button onclick="generateLink()">Generate Sharable Link</button>
            <div id="result">
                <p>Share this link with your crush:</p>
                <input type="text" id="sharable-link" readonly style="width: 100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 5px;">
                <button onclick="copyLink()">Copy Link</button>
            </div>
        </div>

        <div id="reader-view" style="display: none;">
            <h1>💌 A Secret Message Just For You!</h1>
            <p>Someone wanted you to read this...</p>
            <div id="confession-display"></div>
        </div>

    </div>

    <script>
        // JavaScript Functions

        /**
         * Checks the URL for a confession and displays it, or shows the sender view.
         */
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const confession = urlParams.get('c');

            if (confession) {
                // If a confession parameter 'c' exists, show the reader view
                document.getElementById('sender-view').style.display = 'none';
                document.getElementById('reader-view').style.display = 'block';
                
                // Decode and display the message
                const decodedConfession = decodeURIComponent(confession);
                document.getElementById('confession-display').innerText = decodedConfession;
                document.title = "You Got a Confession! 💖";

            } else {
                // Otherwise, show the sender view
                document.getElementById('sender-view').style.display = 'block';
                document.getElementById('reader-view').style.display = 'none';
            }
        };

        /**
         * Encodes the confession text and generates a sharable link.
         */
        function generateLink() {
            const textarea = document.getElementById('confession-text');
            const confession = textarea.value.trim();

            if (confession === '') {
                alert('Please write your confession first!');
                return;
            }

            // Encode the confession text for safe use in a URL
            const encodedConfession = encodeURIComponent(confession);
            
            // Get the base URL (e.g., https://yourdomain.com/index.html)
            const baseUrl = window.location.href.split('?')[0];

            // Create the full sharable link
            const sharableLink = ${baseUrl}?c=${encodedConfession};

            // Display the link to the user
            document.getElementById('sharable-link').value = sharableLink;
            document.getElementById('result').style.display = 'block';
        }

        /**
         * Copies the generated link to the clipboard.
         */
        function copyLink() {
            const linkInput = document.getElementById('sharable-link');
            linkInput.select();
            linkInput.setSelectionRange(0, 99999); // For mobile devices
            document.execCommand('copy');
            alert('Link copied to clipboard! Now send it to your crush!');
        }
    </script>
</body>
</html>
